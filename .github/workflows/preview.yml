name: Preview

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "firebase.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/preview.yml"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    # Forks get no OIDC token and must not deploy to the project.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meling/web build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT }}
      - id: deploy
        run: |
          pnpm exec firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --project meling-app --expires 7d --non-interactive --json > deploy.json
          url=$(jq -r '.result["meling-app"].url' deploy.json)
          expires=$(jq -r '.result["meling-app"].expireTime' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: preview
          message: |
            Forhåndsvisning av web: ${{ steps.deploy.outputs.url }}
            Utløper ${{ steps.deploy.outputs.expires }}. Bruker produksjonsdata i meling-app.
