# Generate the Xcode project with: xcodegen generate
# Meling.xcodeproj is generated and not checked in.
name: Meling
options:
  bundleIdPrefix: app.meling
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
    tvOS: "18.0"

packages:
  MelingKit:
    path: Packages/MelingKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Meling
    PRODUCT_NAME: Meling
    DEVELOPMENT_TEAM: ""

targets:
  Meling-iOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: MelingKit
        product: MelingCore
      - package: MelingKit
        product: MelingFirebase
      - target: Meling-watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meling.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  Meling-macOS:
    type: application
    platform: macOS
    sources: [macOS, Shared]
    dependencies:
      - package: MelingKit
        product: MelingCore
      - package: MelingKit
        product: MelingFirebase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meling.mac
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES

  Meling-watchOS:
    type: application
    platform: watchOS
    sources: [watchOS]
    dependencies:
      - package: MelingKit
        product: MelingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meling.ios.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.meling.ios

  Meling-tvOS:
    type: application
    platform: tvOS
    sources: [tvOS, Shared]
    dependencies:
      - package: MelingKit
        product: MelingCore
      - package: MelingKit
        product: MelingFirebase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meling.tv
